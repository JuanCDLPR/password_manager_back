<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitación privada a {{appName}}</title>
  </head>
  <body style="margin:0;background:#151515;color:#f5f5f5;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#151515;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#242424;border:1px solid #3a3a3a;border-radius:14px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px;background:#1d1d1d;">
                <div style="font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#8ab4f8;">{{appName}}</div>
                <h1 style="margin:10px 0 0;font-size:25px;line-height:1.25;color:#ffffff;">Recibiste una invitación</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 18px;font-size:16px;line-height:1.6;">Hola {{invitedName}},</p>
                <p style="margin:0 0 18px;font-size:16px;line-height:1.6;color:#dddddd;">
                  {{inviterName}} te invitó a crear una cuenta en {{appName}}.
                </p>
                <p style="margin:0 0 26px;font-size:14px;line-height:1.6;color:#aaaaaa;">
                  Este enlace vence el {{expiresAt}} y solo puede utilizarse una vez.
                </p>
                <p style="margin:0;text-align:center;">
                  <a href="{{invitationUrl}}" style="display:inline-block;padding:13px 24px;border-radius:8px;background:#1976d2;color:#ffffff;text-decoration:none;font-weight:bold;">Aceptar invitación</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;border-top:1px solid #3a3a3a;color:#888888;font-size:12px;text-align:center;">
                Si no esperabas este correo, puedes ignorarlo.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
